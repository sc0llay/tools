    if (has(gain)) add("Elevation Gain", fmtNum(mi ? gain * FT : gain), mi ? "ft" : "m", "var(--green)", "", "Elevation");
    if (x && has(x.cadence)) add("Avg. Cadence", fmtNum(x.cadence), "SPM", "var(--teal)");
    if (x && has(x.cyclingCadence)) add("Avg. Cadence", fmtNum(x.cyclingCadence), "rpm", "var(--teal)");
    const pw = x && (x.runningPower || x.cyclingPower);
    if (pw) add("Avg. Power", fmtNum(pw.avg), "W", "var(--orange)");
    if (x && has(x.mets)) add("Avg. METs", fmtNum(x.mets, 1), "", "var(--orange)");
    if (x && has(x.steps)) add("Steps", fmtNum(x.steps), "", "var(--green)");
    if (x && has(x.flights)) add("Flights Climbed", fmtNum(x.flights), "", "var(--teal)");
    if (x && has(x.swimStrokes)) add("Swim Strokes", fmtNum(x.swimStrokes), "", "var(--blue)");
    if (x && has(x.swolf)) add("SWOLF", fmtNum(x.swolf), "", "var(--blue)");
    if (x && has(x.waterTempC)) add("Water Temp", fmtNum(mi ? x.waterTempC * 1.8 + 32 : x.waterTempC, 1), mi ? "°F" : "°C", "var(--blue)");
    const eff = x && (has(x.effort) ? x.effort : has(x.effortEst) ? x.effortEst : null);
    if (eff !== null && eff !== undefined) {
      const est = !(x && has(x.effort));
      add("Effort", `${fmtNum(eff, eff % 1 ? 1 : 0)}`, "/ 10", "var(--blue)", `<span class="wk-s">${effortWord(eff)}${est ? " (estimated)" : ""}</span>`);
    }
    el.innerHTML = eyebrow("Workout Details") + '<div class="wk-grid">' + cells.map((c) =>
      `<div class="wk-c" data-tile="${esc(c.key)}" style="--tone:${c.tone}"><span class="wk-l">${esc(c.title)}</span>` +
      `<b class="wk-v">${esc(c.value)}${c.unit ? `<small>${esc(c.unit)}</small>` : ""}</b>${c.extra}</div>`).join("") + "</div>";
    return el;
  }

  /* VO2max estimate: ACSM + Minetti (+ Apple Watch) averaged; HR inputs default from history, overrides in localStorage. */
  const VO2_KEY = "he.vo2max";
  let histRows = null, hist = null;
  function history() {
    const rows = ctx.data.rows || [];
    if (rows !== histRows) {
      histRows = rows;
      const ser = ctx.data.series || {};
      hist = defaultHr(rows, null, ser.hr ? workoutMinima(rows, ser.hr) : []);
    }
    return hist;
  }
  function vo2Overrides() {
    try { const o = JSON.parse(localStorage.getItem(VO2_KEY) || "null"); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; }
  }
  function saveVo2Overrides(o) {
    try { if (o.hrMax === undefined && o.hrRest === undefined) localStorage.removeItem(VO2_KEY); else localStorage.setItem(VO2_KEY, JSON.stringify(o)); } catch (e) { /* storage blocked */ }
  }

  function vo2CardEl(r, gain) {
    if (!suitability(r, gain).ok) return null;
    const h = history();
    const measured = nearestMeasured((ctx.data.series || {}).vo2max, r.start, 30);
    let ov = vo2Overrides();
    const el = card("vo2max", "wk-vo2");
    el.innerHTML = eyebrow("VO₂max Estimate", "ml/kg/min") +
      '<div class="wk-big"><b data-v="final">—</b><small data-v="note"></small></div>' +
      '<div class="wk-grid"></div>' +
      '<div class="wk-vo2-in"><label>HR max (bpm)<input type="number" inputmode="numeric" min="100" max="230" data-in="hrMax"></label>' +
      '<label>HR rest (bpm)<input type="number" inputmode="numeric" min="30" max="120" data-in="hrRest"></label>' +
      '<button type="button" class="btn ghost" data-act="reset">Reset to history</button></div>' +
      '<div class="wk-vo2-note"></div>';
    const grid = el.querySelector(".wk-grid"), note = el.querySelector(".wk-vo2-note");
    const inMax = el.querySelector('[data-in="hrMax"]'), inRest = el.querySelector('[data-in="hrRest"]');
    const val = () => ({ hrMax: ov.hrMax !== undefined ? ov.hrMax : h.hrMax, hrRest: ov.hrRest !== undefined ? ov.hrRest : h.hrRest });
    const tile = (title, v, sub, key) => `<div class="wk-c" data-tile="${key}" style="--tone:var(--o2)"><span class="wk-l">${title}</span><b class="wk-v">${v === null ? "—" : fmtNum(v, 1)}</b><span class="wk-s">${sub}</span></div>`;
    const paint = () => {
      const { hrMax, hrRest } = val();
      const c = Number.isFinite(hrMax) && Number.isFinite(hrRest) && hrMax > hrRest ? vo2Card(r, hrRest, hrMax, measured, gain) : null;
      const set = (k, t) => { el.querySelector(`[data-v="${k}"]`).textContent = t; };
      set("final", c ? fmtNum(c.final, 1) : "—");
      const n = c ? [c.acsm, c.minetti, c.watch].filter((v) => v !== null).length : 0;
      set("note", c ? `average of ${n} estimate${n === 1 ? "" : "s"}` : "no estimate with these inputs");
      const walk = c ? c.mode === "walk" : /Walk|Hik/.test(r.type);
      grid.innerHTML =
        tile("ACSM", c ? c.acsm : null, c && c.acsm === null ? "outside 15–90" : "equations", "ACSM") +
        tile("Minetti", c ? c.minetti : null, walk ? "running only" : "cost curve", "Minetti") +
        tile("Apple Watch", measured ? measured.value : null, measured ? esc(fmtDate(measured.t, r.tzOffset).split(",")[0]) : "none within 30 days", "Apple Watch");
      const pct = c ? Math.round(c.hrr * 100) : null;
      note.textContent = (pct !== null ? `Effort ${pct}% of heart-rate reserve${pct < 60 ? ", low, so treat as a rough figure" : ""}. ` : "") +
        `Defaults come from your workouts (rest ${h.hrRest === null ? "—" : h.hrRest}, max ${h.hrMax === null ? "—" : h.hrMax} bpm).`;
      for (const [inp, k] of [[inMax, "hrMax"], [inRest, "hrRest"]]) if (document.activeElement !== inp) inp.value = val()[k] === null ? "" : String(val()[k]);
    };
    el.addEventListener("input", (e) => {
      const k = e.target && e.target.dataset && e.target.dataset.in;
      if (!k) return;
      const n = Number(e.target.value);
      ov = { ...ov };
      if (e.target.value === "" || !(n > 0)) delete ov[k]; else ov[k] = n;
      saveVo2Overrides(ov);
      paint();
    });
    el.addEventListener("click", (e) => {
      if (!e.target.closest('[data-act="reset"]')) return;
      ov = {}; saveVo2Overrides(ov); paint();
    });
    paint();
    return el;
  }

  function formCard(r, x, units) {
    if (!x) return null;
    const rows = [];
    const mi = units === "mi";
    if (has(x.strideLength)) rows.push(["Stride Length", fmtNum(mi ? x.strideLength * FT : x.strideLength, mi ? 1 : 2), mi ? "FT" : "M", "var(--teal)"]);
    if (has(x.groundContact)) rows.push(["Ground Contact Time", fmtNum(x.groundContact), "MS", "var(--orange)"]);
    if (has(x.verticalOscillation)) rows.push(["Vertical Oscillation", fmtNum(mi ? x.verticalOscillation / 2.54 : x.verticalOscillation, 1), mi ? "IN" : "CM", "var(--blue)"]);
    if (x.runningSpeed) {
      const f = mi ? 1 / MI : 1;
      const rng = x.runningSpeed;
      rows.push(["Running Speed", fmtNum(rng.avg * f, 1), mi ? "MPH" : "KM/H", "var(--green)", has(rng.min) && has(rng.max) ? `${fmtNum(rng.min * f, 1)}–${fmtNum(rng.max * f, 1)}` : ""]);
    }
    if (x.runningPower && x.runningPower.min !== null && x.runningPower.max !== null) {
      rows.push(["Power Range", `${fmtNum(x.runningPower.min)}–${fmtNum(x.runningPower.max)}`, "W", "var(--orange)"]);
    }
    if (!rows.length) return null;
    const el = card("form");
    el.innerHTML = eyebrow("Running Form") + '<div class="wk-grid">' + rows.map((c) =>
      `<div class="wk-c" data-tile="${esc(c[0])}" style="--tone:${c[3]}"><span class="wk-l">${esc(c[0])}</span><b class="wk-v">${esc(c[1])}<small>${esc(c[2])}</small></b>${c[4] ? `<span class="wk-s">${esc(c[4])} ${mi ? "mph" : "km/h"} range</span>` : ""}</div>`).join("") + "</div>";
    return el;
  }

  /** Splits table; `list` from a GPX (per unit) or Apple's km segments. */
  function splitsCard(r, list, units, label, hr) {
    if (!list || !list.length) return null;
    const mi = units === "mi";
    const unitLabel = label === "km" || !mi ? "km" : "mi";
    const showHr = !!hr;
    const showGain = list.some((s) => has(s.gain));
    const paces = list.filter((s) => !s.partial || s.km > 0.5).map((s) => s.paceMinKm);
    const fast = Math.min(...paces), slow = Math.max(...paces);
    const el = card("splits");
    const rowsHtml = list.map((s) => {
      const u = slow - fast > 1e-6 ? (slow - s.paceMinKm) / (slow - fast) : 0.7;
      const w = 34 + 66 * Math.max(0, Math.min(1, u));
      const pace = unitLabel === "mi" ? s.paceMinKm * MI : s.paceMinKm;
      const secs = Math.round(pace * 60);
      const hrv = showHr ? meanHrBetween(hr, r.start, s.t0, s.t1) : null;
      const dist = s.partial ? ` <small style="color:var(--label-2);font-weight:500">${fmtNum(unitLabel === "mi" ? s.km / MI : s.km, 2)} ${unitLabel}</small>` : "";
      return `<tr class="${s.partial ? "part" : ""}"><td>${s.n}</td><td class="pace"><div class="wk-pbar"><i style="width:${w.toFixed(0)}%;background:${paceColor(u)}"></i><b>${Math.floor(secs / 60)}:${p2(secs % 60)}</b>${dist}</div></td>` +
        (showHr ? `<td>${hrv === null ? "—" : fmtNum(hrv)}</td>` : "") +
        (showGain ? `<td>${has(s.gain) ? fmtNum(unitLabel === "mi" ? s.gain * FT : s.gain) : "—"}</td>` : "") + "</tr>";
    }).join("");
    el.innerHTML = eyebrow("Splits", esc(unitLabel.toUpperCase())) +
      `<table class="wk-tbl"><thead><tr><th>${unitLabel.toUpperCase()}</th><th style="text-align:left">Pace /${unitLabel}</th>${showHr ? "<th>HR</th>" : ""}${showGain ? `<th>Elev ${unitLabel === "mi" ? "ft" : "m"}</th>` : ""}</tr></thead><tbody>${rowsHtml}</tbody></table>`;
    return el;
  }

  function hrCard(r, hr) {
    if (!hr || !hr.t || !hr.t.length) return null;
    const b = hr.t.length > 600 ? bin(hr.t, hr.v, Math.max(5, Math.ceil(r.durMin * 60 / 400))) : hr;
    const pts = [];
    for (let i = 0; i < b.t.length; i++) pts.push([b.t[i] / 60, b.v[i]]);
    let mn = Infinity, mx = -Infinity, sum = 0;
    for (let i = 0; i < hr.v.length; i++) { const v = hr.v[i]; if (v < mn) mn = v; if (v > mx) mx = v; sum += v; }
    const avg = has(r.avgHr) ? r.avgHr : sum / hr.v.length;
    const el = card("hr");
    el.innerHTML = eyebrow("Heart Rate") +
      `<div class="wk-stats"><div><span>Avg</span><b>${fmtNum(avg)}</b><small>bpm</small></div><div><span>Max</span><b>${fmtNum(has(r.maxHr) ? r.maxHr : mx)}</b><small>bpm</small></div><div><span>Min</span><b>${fmtNum(mn)}</b><small>bpm</small></div></div><div class="host"></div>`;
    const host = el.querySelector(".host");
    return { el, mount() { parts.push(line(host, { series: [{ name: "Heart rate", color: "var(--red)", points: pts }], x: { fmt: (v) => fmtDur(v) }, y: { fmt: (v) => fmtNum(v), tipFmt: (v) => fmtNum(v) + " bpm" }, height: 200 })); } };
  }

  function zonesCard(x) {
    const z = zoneModel(x && x.zones);
    if (!z) return null;
    const el = card("zones");
    const top = Math.max(...z.map((s) => s.pct));
    el.innerHTML = eyebrow("Heart Rate Zones") + z.slice().reverse().map((s) =>
      `<div class="wk-zone" data-zone="${s.n}"><div class="zl"><b>${s.label}</b><span>${s.range ? s.range + " bpm" : ""}</span></div>` +
      `<div class="zb"><i style="width:${(top > 0 ? (s.pct / top) * 100 : 0).toFixed(1)}%;background:${s.color}"></i></div>` +
      `<div class="zt">${fmtDur(s.sec / 60)}<small>${fmtNum(s.pct)}%</small></div></div>`).join("");
    return el;
  }

  function trackCharts(r, m, units, cyc) {
    const out = [];
    if (!m) return out;
    const mi = units === "mi";
    const idx = strideIdx(m.n, 360);
    const dist = (i) => (mi ? m.cum[i] / MI : m.cum[i]);
    if (m.speed) {
      const pts = idx.map((i) => {
        const v = m.speed[i];
        if (cyc) return [dist(i), v > 0.3 ? v * 3.6 * (mi ? 1 / MI : 1) : null];
        const pace = v > 0.3 ? 1000 / v / 60 : null; // min/km
        return [dist(i), pace !== null && pace < 20 ? -(mi ? pace * MI : pace) : null];
      });
      if (pts.some((p) => p[1] !== null)) {
        const el = card(cyc ? "speed" : "pace");
        el.innerHTML = eyebrow(cyc ? "Speed" : "Pace", cyc ? (mi ? "MPH" : "KM/H") : mi ? "/MI" : "/KM") + '<div class="host"></div>';
        out.push({ el, mount() {
          parts.push(line(el.querySelector(".host"), { series: [{ name: cyc ? "Speed" : "Pace", color: "var(--blue)", points: pts }],
            x: { fmt: (v) => fmtNum(v, v % 1 ? 1 : 0) + (mi ? " mi" : " km") },
            y: cyc ? { fmt: (v) => fmtNum(v) } : { fmt: (v) => paceText(-v * (mi ? 1 / MI : 1), units), tipFmt: (v) => paceText(-v * (mi ? 1 / MI : 1), units) + (mi ? " /mi" : " /km") }, height: 190 }));
        } });
      }
    }
    if (m.ele) {
      let lo = Infinity, hi = -Infinity;
      for (const i of idx) { const e = mi ? m.ele[i] * FT : m.ele[i]; if (e < lo) lo = e; if (e > hi) hi = e; }
      if (hi - lo >= 2) {
        const pts = idx.map((i) => [dist(i), mi ? m.ele[i] * FT : m.ele[i]]);
        const el = card("elev");
        el.innerHTML = eyebrow("Elevation", mi ? "FT" : "M") + '<div class="host"></div>';
        out.push({ el, mount() {
          parts.push(line(el.querySelector(".host"), { series: [{ name: "Elevation", color: "var(--green)", points: pts }],
            x: { fmt: (v) => fmtNum(v, v % 1 ? 1 : 0) + (mi ? " mi" : " km") }, y: { fmt: (v) => fmtNum(v), tipFmt: (v) => fmtNum(v) + (mi ? " ft" : " m") }, height: 190 }));
        } });
      }
    }
    return out;
  }

  function mapCard(r, m, units) {
    const el = card("map");
    el.dataset.route = r.route;
    const tracks = [{ lat: m.lat, lon: m.lon, colors: paceColors(m) || undefined }];
    el.innerHTML = eyebrow("Route", m.speed ? '<span class="wk-legend">Slower<i></i>Faster</span>' : "") + '<div class="host"></div><div class="wk-mapnote"></div>';
    const host = el.querySelector(".host"), note = el.querySelector(".wk-mapnote");
    let rm = null;
    const paint = () => {
      if (rm) { rm.destroy(); const i = parts.indexOf(rm); if (i >= 0) parts.splice(i, 1); }
      host.textContent = "";
      rm = routeMap(host, { tracks, settings, travelMode: /Cycl/.test(r.type) ? "bicycling" : "walking" });
      parts.push(rm);
      const on = settings.get("onlineMaps") !== false;
      note.innerHTML = on
        ? '<p>Map tiles load from Esri over the internet. Your route itself is drawn on this device.</p><button type="button" class="btn ghost" data-act="offline">Turn off online maps</button>'
        : '<p>Online maps are off, so only the route outline is shown. Nothing is fetched.</p><button type="button" class="btn ghost" data-act="online">Show map tiles</button>';
    };
    note.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      settings.set("onlineMaps", b.dataset.act === "online");
      paint();
    });
    paint();
    return el;
  }

  function dayCard(r) {
    const el = card("day", "wk-day");
    el.setAttribute("aria-label", "Day context");
    const item = (label, v, u) => `<div><span class="eyebrow">${label}</span><b>${v}</b>${v !== "—" ? `<small>${u}</small>` : ""}</div>`;
    el.innerHTML = item("Resting HR", fmtNum(r.rhrDay), "bpm") + item("HRV", fmtNum(r.hrvDay), "ms") + item("Body mass", fmtNum(r.massKg, 1), "kg");
    return el;
  }

  /* ----------------------------------------------------------------- page */

  function build(r, units) {
    clearParts();
    const my = token;
    const x = r.ext || null;
    const cyc = /Cycl/.test(r.type);
    const el = document.createElement("div");
    el.className = "wk fx-detail";
    el.dataset.id = String(r.id);

    el.appendChild(header(r, x, units));

    const notes = document.createElement("div");
    notes.className = "wk-notes";
    if (r.manual) ui.banner(notes, { tone: "info", html: `<b>Manual entry.</b> Round values from ${esc(r.source)} suggest this was typed in, so pace and heart rate are approximate.` });
    if (has(r.dupOf)) {
      const o = find(r.dupOf);
      ui.banner(notes, { tone: "warn", html: `<b>Possible duplicate.</b> Overlaps an earlier ${esc(typeLabel(r.type))}${o ? ` from ${esc(o.source)} (${esc(fmtDate(o.start, o.tzOffset))})` : ""} recorded by another source.` });
    }
    if (notes.children.length) el.appendChild(notes);

    // route slot comes first, details second; both are filled in below / when the GPX arrives
    const mapSlot = document.createElement("div");
    mapSlot.className = "wk-mapslot";
    if (r.route) el.appendChild(mapSlot);
    // details + VO2max sit side by side as two square tiles (stacked 1 per row on narrower screens)
    const topCols = document.createElement("div");
    topCols.className = "wk-cols two wk-top";
    el.appendChild(topCols);
    const detailsSlot = document.createElement("div");
    detailsSlot.style.display = "contents";
    topCols.appendChild(detailsSlot);
    detailsSlot.appendChild(detailsCard(r, x, units, null));
    const vo2Slot = document.createElement("div");
    vo2Slot.style.display = "contents";
    topCols.appendChild(vo2Slot);
    const putVo2 = (gain) => {
      vo2Slot.textContent = "";
      try { const c = vo2CardEl(r, gain); if (c) vo2Slot.appendChild(c); } catch (e) { /* estimate is optional */ }
      topCols.classList.toggle("one", !vo2Slot.firstChild);
    };
    putVo2(null);

    const formEl = formCard(r, x, units);
    const splitsSlot = document.createElement("div");
    splitsSlot.style.display = "contents";
    const firstCols = document.createElement("div");
    firstCols.className = "wk-cols two";
    if (formEl) firstCols.appendChild(formEl);
    firstCols.appendChild(splitsSlot);
    el.appendChild(firstCols);

    const hr = ctx.hrFor ? ctx.hrFor(r) : null;
    const hc = hrCard(r, hr);
    const zc = zonesCard(x);
    const hrCols = document.createElement("div");
    hrCols.className = "wk-cols" + (hc && zc ? " two" : "");
    if (hc) hrCols.appendChild(hc.el);
    if (zc) hrCols.appendChild(zc);
    if (hc || zc) el.appendChild(hrCols);
    if (hc) hc.mount();

    const chartSlot = document.createElement("div");
    chartSlot.className = "wk-cols two";
    el.appendChild(chartSlot);

    // splits from Apple's segment events until a GPX replaces them
    const segSplits = x && x.segments && !cyc ? splitsFromSegments(x.segments, r.distKm) : [];
    const putSplits = (sc) => { splitsSlot.textContent = ""; if (sc) splitsSlot.appendChild(sc); firstCols.style.display = formEl || sc ? "" : "none"; };
    putSplits(splitsCard(r, segSplits, "km", "km", hr));

    el.appendChild(dayCard(r));

    const act = document.createElement("div");
    act.className = "wk-actions";
    btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn";
    btn.dataset.compare = "";
    cmpRow = r.id;
    btn.onclick = () => {
      const cur = state.get().selection || [];
      if (cur.includes(r.id)) state.set({ selection: cur.filter((v) => v !== r.id) });
      else if (cur.length < MAX_COMPARE) state.set({ selection: [...cur, r.id] });
    };
    act.appendChild(btn);
    if (has(r.distKm)) {
      const sim = document.createElement("button");
      sim.type = "button";
      sim.className = "btn ghost";
      sim.textContent = "Find similar";
      sim.onclick = () => state.set((s) => ({ filters: { ...s.filters, similarTo: r.id }, detail: null }));
      act.appendChild(sim);
    }
    el.appendChild(act);
    paintBtn();

    // GPX: map, pace + elevation, per-unit splits, elevation gain fallback
    if (r.route) {
      const say = (t) => { mapSlot.innerHTML = `<div class="wk-card glass wk-load" data-sec="map" data-route="${esc(r.route)}">${esc(t)}</div>`; };
      say("Loading route…");
      Promise.resolve(ctx.gpxFor ? ctx.gpxFor(r) : null).then((g) => {
        if (my !== token) return;
        const m = trackMetrics(g);
        if (!m) { say("The route file for this workout is not loaded. Drop the workout-routes folder with your export to see the map."); return; }
        mapSlot.textContent = "";
        mapSlot.appendChild(mapCard(r, m, units));
        detailsSlot.textContent = "";
        detailsSlot.appendChild(detailsCard(r, x, units, m));
        if (!has(r.elevM) && m.ele) putVo2(elevGain(m));
        if (m.t && !cyc) putSplits(splitsCard(r, splitsFromTrack(m, units === "mi" ? MI : 1), units, units === "mi" ? "mi" : "km", hr));
        chartSlot.textContent = "";
        for (const c of trackCharts(r, m, units, cyc)) { chartSlot.appendChild(c.el); c.mount(); }
        chartSlot.style.display = chartSlot.children.length ? "" : "none";
      }, () => { if (my === token) say("The route could not be read."); });
    } else chartSlot.style.display = "none";
    return el;
  }

  function sync() {
    const s = state.get();
    const id = s.detail === undefined ? null : s.detail;
    if (id === null) {
      if (shownId !== null) { shownId = null; shownUnits = null; btn = null; cmpRow = null; clearParts(); if (drawer && drawer.close) drawer.close(); }
      return;
    }
    const r = find(id);
    if (!r) return;
    const units = s.units || "km";
    if (shownId !== id || shownUnits !== units) {
      shownId = id; shownUnits = units;
      drawer.open(build(r, units), "Workout");
    } else paintBtn();
  }

  const offClose = drawer && drawer.onClose ? drawer.onClose(() => {
    if (shownId !== null) { shownId = null; shownUnits = null; btn = null; cmpRow = null; clearParts(); if (state.get().detail !== null) state.set({ detail: null }); }
  }) : null;
  const unsub = state.subscribe(sync);
  sync();
  return {
    update() { shownId = null; sync(); },
    destroy() { unsub(); clearParts(); if (offClose) offClose(); },
  };
}

return { paceText, longDate, mount };
