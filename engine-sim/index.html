<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engine Simulator</title>
<meta name="theme-color" content="#0f1215">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/engine-sim-180.png">
<meta name="description" content="Interactive 3D internal combustion engine simulator with sound, cutaways and configurable engine geometry.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23161a1f' stroke='%23ff8a3d' stroke-width='6'/%3E%3Cpath d='M32 32 L48 18' stroke='%23ffd166' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root {
  --bg: #0f1215;
  --bg2: #161a1f;
  --bg3: #1d2228;
  --line: #2a3139;
  --line2: #36404a;
  --text: #e6e9ed;
  --muted: #8f99a4;
  --dim: #5d6772;
  --accent: #ff8a3d;
  --accent2: #ffd166;
  --intake: #4aa8ff;
  --compress: #3cc9b4;
  --power: #ff6a3d;
  --exhaust: #8d8580;
  --danger: #ff4d4d;
  --ok: #5fd38d;
  --radius: 8px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --panel-w: 360px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100%; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 52px;
  background: var(--bg2); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; }
.brand span { color: var(--muted); font-weight: 500; }
.topbar .preset { min-width: 220px; max-width: 320px; }
.summary { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 200px; min-width: 0; }
.summary b { color: var(--text); font-weight: 600; }
.top-actions { display: flex; gap: 8px; align-items: center; }

/* ---------- controls ---------- */
.btn {
  appearance: none; border: 1px solid var(--line2); background: var(--bg3); color: var(--text);
  padding: 7px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; line-height: 1.1;
  transition: background .12s, border-color .12s, color .12s; user-select: none; -webkit-user-select: none;
}
.btn:hover { background: #252b33; border-color: #46515c; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0f06; font-weight: 700; }
.btn.primary:hover { background: #ff9d5c; }
.btn.danger { background: #3a1c1c; border-color: #6b2b2b; color: #ffb3b3; }
.btn.on { background: #2b3a2f; border-color: #3f6b4c; color: #b8f0c9; }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 4px 6px; }
.btn.ghost:hover { background: var(--bg3); border-color: var(--line2); color: var(--text); }

/* saved engines */
.saved-list { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.saved-row { display: flex; align-items: center; gap: 2px; border-radius: 6px; border: 1px solid transparent; }
.saved-row.current { border-color: var(--line2); background: var(--bg); }
.saved-name { appearance: none; background: none; border: 0; cursor: pointer; text-align: left; flex: 1; min-width: 0; padding: 5px 6px; border-radius: 6px; display: flex; flex-direction: column; }
.saved-name:hover { background: var(--bg3); }
.saved-name span { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved-row.current .saved-name span { color: var(--accent); }
.saved-name small { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn[disabled] { opacity: .45; cursor: default; }

select, input[type=number], input[type=text], textarea {
  background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; min-width: 0;
}
select { padding-right: 24px; }
textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 11px; }
input[type=number] { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=number].invalid, input[type=text].invalid { border-color: var(--danger); }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--pct, 0%), var(--line2) var(--pct, 0%)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line2); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; margin-top: -5px; border: 0; box-shadow: 0 1px 3px #0008; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 0; }

.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: var(--bg); }
.seg button { appearance: none; border: 0; background: transparent; padding: 5px 9px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--text); background: #1b2026; }
.seg button.active { background: var(--accent); color: #1a0f06; font-weight: 600; }
.seg.small button { padding: 3px 7px; font-size: 11px; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 30px; height: 17px; border-radius: 9px; background: var(--line2); position: relative; cursor: pointer; transition: background .15s; margin: 0; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #cfd5db; transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(13px); background: #fff; }

/* ---------- layout ---------- */
.main { flex: 1; display: flex; min-height: 0; }
.viewport { position: relative; flex: 1; min-width: 0; overflow: hidden; background: #14171b; touch-action: none; }
.viewport > canvas { display: block; width: 100%; height: 100%; }
.panel { width: var(--panel-w); flex: none; background: var(--bg2); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--bg2); flex: none; }
.tabs button { flex: 1 1 auto; min-width: 0; appearance: none; border: 0; background: transparent; color: var(--muted); padding: 11px 2px 9px; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600; font-size: 12px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 14px 24px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.tab-body[hidden] { display: none; }

.section { padding: 12px 0; border-bottom: 1px solid var(--line); }
.section:last-child { border-bottom: 0; }
.section h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section h3 .grow { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; margin: 7px 0; min-height: 26px; }
.row > label, .row > .lbl { flex: 1; color: #c3cad1; min-width: 0; }
.row .unit { color: var(--dim); font-size: 11px; width: 34px; }
.row .val { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text); min-width: 58px; text-align: right; font-size: 12px; }
.slider-row { margin: 8px 0 10px; }
.slider-row .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1px; }
.slider-row .top span:first-child { color: #c3cad1; }
.slider-row .top .val { font-family: var(--mono); font-size: 12px; }
.hint { color: var(--dim); font-size: 11px; margin: 4px 0; }
.hint kbd, .kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--bg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.stat .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { color: var(--muted); font-size: 10px; margin-left: 2px; }

.comp-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.comp-row .name { flex: 1; color: #c3cad1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.warn { background: #3a2a14; border: 1px solid #6b4a1c; color: #ffd9a3; border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 12px; }
.err { background: #3a1a1a; border: 1px solid #6b2b2b; color: #ffb3b3; border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 12px; }
.derived { font-family: var(--mono); font-size: 11px; color: #c3cad1; }
.derived table { width: 100%; border-collapse: collapse; }
.derived td { padding: 2px 0; border-bottom: 1px dashed #232a31; }
.derived td:last-child { text-align: right; color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg); }
.chip.a { border-color: #6b4a2a; color: #ffc08a; }
.chip.b { border-color: #2a4a6b; color: #9fd0ff; }
.throws { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.throws label { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--dim); }
.throws input { width: 100%; }
.sticky-apply { position: sticky; bottom: -24px; background: linear-gradient(transparent, var(--bg2) 30%); padding: 14px 0 12px; display: flex; gap: 8px; }
.dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* ---------- HUD ---------- */
.hud { position: absolute; pointer-events: none; z-index: 2; }
.hud > * { pointer-events: auto; }
.hud-tl { top: 10px; left: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.hud-tr { top: 10px; right: 10px; width: min(360px, 42%); display: flex; flex-direction: column; gap: 8px; }
.hud-bottom { left: 10px; right: 10px; bottom: 10px; display: flex; gap: 10px; align-items: flex-end; }
.glass { background: rgba(14, 17, 21, .78); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.flow-legend { padding: 6px 10px 5px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; align-self: flex-end; width: 200px; }
.flow-legend .scale { height: 8px; border-radius: 3px; margin: 4px 0 2px; }
.flow-legend .ticks { display: flex; justify-content: space-between; font-family: var(--mono); text-transform: none; letter-spacing: 0; color: var(--text); }
.tach-card { padding: 8px; display: flex; gap: 10px; align-items: stretch; }
.tach-card canvas { display: block; }
.bars { display: flex; flex-direction: column; justify-content: center; gap: 8px; width: 118px; }
.bar { font-size: 10px; color: var(--muted); }
.bar .t { display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: .5px; }
.bar .t b { color: var(--text); font-family: var(--mono); font-weight: 500; font-size: 11px; }
.bar .track { height: 5px; background: #242a31; border-radius: 3px; overflow: hidden; margin-top: 2px; }
.bar .fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }
.status-pills { display: flex; gap: 4px; flex-wrap: wrap; }
.pill { flex: none; white-space: nowrap; font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line2); color: var(--dim); letter-spacing: .4px; text-transform: uppercase; font-weight: 700; }
.pill.lit { color: #1a0f06; background: var(--accent2); border-color: var(--accent2); }
.pill.lit.red { background: var(--danger); border-color: var(--danger); color: #fff; }
.pill.lit.green { background: var(--ok); border-color: var(--ok); }

.plot-card { padding: 8px 10px 6px; }
.plot-card .head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.plot-card .head .title { flex: 1; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plot-card canvas { display: block; width: 100%; }
.cyl-info { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; column-gap: 10px; row-gap: 1px; flex-wrap: wrap; margin-top: 3px; font-variant-numeric: tabular-nums; }
/* the stroke name has its own line; fixed-width cells keep the numbers from jumping about */
.cyl-info .phase { flex-basis: 100%; }
.cyl-info .c-p { min-width: 14ch; }
.cyl-info .c-T { min-width: 12ch; }
.cyl-info b { color: var(--text); font-weight: 500; }

.readouts-card { flex: 1; min-width: 0; padding: 7px 10px 8px; }
.readouts-card .head { font-size: 11px; color: var(--muted); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.readouts-card .head b { color: var(--text); }
.live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 5px; }
.live { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.06); border-radius: 6px; padding: 3px 7px 4px; min-width: 0; }
.live[hidden] { display: none; }
.live .k { color: var(--dim); font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live .v { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.live .v small { color: var(--muted); font-size: 10px; margin-left: 3px; }

.throttle-card { width: 170px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.rev-btn { height: 58px; font-size: 14px; font-weight: 800; letter-spacing: .6px; touch-action: none; border-radius: 8px; }
.rev-btn.pressed { background: var(--power); border-color: var(--power); color: #fff; }

.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); background: rgba(15,18,21,.55); z-index: 5; pointer-events: none; opacity: 0; transition: opacity .2s; }
.loading.show { opacity: 1; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: absolute; left: 50%; top: 14px; transform: translate(-50%, -8px); background: rgba(20,24,28,.95); border: 1px solid var(--line2); padding: 7px 12px; border-radius: 8px; z-index: 6; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 80%; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.fatal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; color: var(--muted); z-index: 10; }
.fatal div { max-width: 460px; }
.fatal h2 { color: var(--text); }

.dyno-canvas { width: 100%; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.runs { display: flex; flex-direction: column; gap: 4px; }
.run-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.run-item i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.run-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-item .num { font-family: var(--mono); color: var(--muted); font-size: 11px; }

.help-keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; color: #c3cad1; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  :root { --panel-w: 320px; }
  .hud-tr { width: min(300px, 45%); }
}
@media (max-width: 820px) {
  html, body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  .main { flex-direction: column; }
  .viewport { height: 62vh; min-height: 380px; flex: none; }
  .panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  .tab-body { overflow: visible; }
  .topbar { padding: 8px 10px; gap: 8px; }
  .topbar .preset { min-width: 0; flex: 1 1 160px; }
  .summary { display: none; }
  .hud-tr { width: 52%; }
  .hud-tr .cyl-info { display: none; }
  .throttle-card { width: 112px; }
  .rev-btn { height: 48px; font-size: 12px; }
  .bars { display: none; }
  .live.minor2 { display: none; }
  .live-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .sticky-apply { position: static; }
}
@media (max-width: 520px) {
  .hud-tr { display: none; }
  .hud-tl { transform: scale(.75); transform-origin: top left; }
  .throttle-card { width: 96px; padding: 6px 8px; }
  .status-pills { max-width: 190px; }
  .rev-btn { white-space: normal; line-height: 1.15; font-size: 11px; letter-spacing: .3px; padding: 0 4px; }
  .live.minor1 { display: none; }
  .readouts-card .head { display: none; }
  .live-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .live .v { font-size: 13px; }
}

/* boost curve editor */
.curve-canvas { cursor: ns-resize; outline: none; border-radius: 6px; }
.curve-canvas:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.curve-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main class="main">
    <section class="viewport" id="viewport">
      <div class="hud hud-tl" id="hudTL"></div>
      <div class="hud hud-tr" id="hudTR"></div>
      <div class="hud hud-bottom" id="hudBottom"></div>
      <div class="loading" id="loading"><div class="spinner"></div><span>Building engine…</span></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>

    const v2 = this.ic2 + this.a2 * this.ic1 + this.a3 * v3;
    this.ic1 = 2 * v1 - this.ic1;
    this.ic2 = 2 * v2 - this.ic2;
    this.low = v2; this.band = v1; this.high = v0 - this.k * v1 - v2;
    return v2;
  }

}

/** Two-pole resonator: an impulse of 1 rings at unit amplitude. */
class Ring {
  constructor() { this.y1 = 0; this.y2 = 0; this.a1 = 0; this.a2 = 0; this.g = 0; this.x = 0; }
  set(sr, f, decay) {
    const r = Math.exp(-1 / (decay * sr));
    const w = TWO_PI * clampN(f, 10, sr * 0.45) / sr;
    this.a1 = 2 * r * Math.cos(w); this.a2 = r * r; this.g = Math.sin(w);
  }
  run() {
    const y = this.a1 * this.y1 - this.a2 * this.y2 + this.x * this.g;
    this.x = 0; this.y2 = this.y1; this.y1 = y;
    return y;
  }
}

/** Buffer that can be written ahead of the read head (for pulses and delays). */
class WriteAhead {
  constructor(size) { this.buf = new Float32Array(size); this.mask = size - 1; this.w = 0; }
  add(offset, v) { this.buf[(this.w + offset) & this.mask] += v; }
  read() { const v = this.buf[this.w]; this.buf[this.w] = 0; this.w = (this.w + 1) & this.mask; return v; }
  clear() { this.buf.fill(0); }
}

/** Feedback comb with a damping low-pass in the loop (pipe resonance). */
class Comb {
  constructor(size) { this.buf = new Float32Array(size); this.size = size; this.i = 0; this.lp = 0; this.D = 64; this.Dt = 64; this.g = 0; this.damp = 0.3; }
  run(x) {
    // the delay glides towards its target, read between samples (no zipper noise as it moves)
    this.D += (this.Dt - this.D) * 0.0005;
    const d = this.D, di = Math.floor(d), fr = d - di;
    let j = this.i - di; if (j < 0) j += this.size;
    let j1 = j - 1; if (j1 < 0) j1 += this.size;
    const tap = this.buf[j] + (this.buf[j1] - this.buf[j]) * fr;
    this.lp += (tap - this.lp) * this.damp;
    const y = x + this.g * this.lp;
    this.buf[this.i] = y;
    if (++this.i >= this.size) this.i = 0;
    return y;
  }
  clear() { this.buf.fill(0); this.lp = 0; }
}

/** Schroeder allpass: smears a pulse in time without colouring its spectrum. */
class Allpass {
  constructor(D, g) { this.buf = new Float32Array(D); this.D = D; this.i = 0; this.g = g; }
  run(x) {
    const d = this.buf[this.i];
    const v = x + this.g * d;
    this.buf[this.i] = v;
    if (++this.i >= this.D) this.i = 0;
    return d - this.g * v;
  }
  clear() { this.buf.fill(0); }
}

class BankChain {
  constructor(sr) {
    const size = 1 << Math.ceil(Math.log2(sr * 0.12));
    this.wa = new WriteAhead(size);
    this.pipe = new Comb(1 << Math.ceil(Math.log2(sr * 0.04)));
    this.ch1 = new Comb(1 << Math.ceil(Math.log2(sr * 0.03)));
    this.ch2 = new Comb(1 << Math.ceil(Math.log2(sr * 0.03)));
    this.lp = new SVF(); this.lp2 = new SVF();
    this.body = new SVF();
    this.turb = new SVF(); // the turbine's smoothing of the pulses
    // perforated tubes and packing: three short allpasses (prime-ish lengths, a little different per bank)
    this.diff = [0.00037, 0.00071, 0.00113].map((t) => new Allpass(Math.max(2, Math.round(t * sr)), 0.55));
  }
}

export class EngineDSP {
  constructor(sr) {
    this.sr = sr;
    this.cfg = null;
    this.theta = 0; this.rpm = 0; this.phaseErr = 0;
    this.events = []; this.evIdx = 0; this.base = 0; this.nextA = Infinity;
    this.st = { t: 0, theta: 0, rpm: 0, crankRpm: 0, throttle: 0, pMan: 1e5, pExh: 1e5, egt: 300, starter: false, ignition: false, dfco: false, running: false,
      ind: 0, pB: 1e5, nC: 0, flowC: 0, surge: 0 };

    this.cylGain = new Float32Array(16).fill(1);
    this.cylTau = new Float32Array(16).fill(1);
    this.peak = new Float32Array(16).fill(1e5);
    this.fired = new Uint8Array(16);
    this.msgPending = false;
    this.lastMsg = -1;
    this.volume = 0.7;
    this.view = 'exhaust';
    this.g = { exh: 1, rasp: 1, intake: 0.3, mech: 0.25, muffler: 1, cabin: 18000, room: 0.16, boost: 0.4 };
    this.gs = { exh: 1, rasp: 1, intake: 0.3, mech: 0.25, muffler: 1, cabin: 18000, room: 0.16, boost: 0.4, alive: 0 };
    this.thr = 0; this.flowS = 0; this.vacS = 0; this.starterEnv = 0;

    this.whoosh = new SVF(); this.bovBP = new SVF(); this.bovHP = new SVF(); this.surgeBP = new SVF();
    this.bovBP.set(sr, 1900, 0.9); this.bovHP.set(sr, 5200, 0.7); this.surgeBP.set(sr, 850, 1.2);
    this.fcCounter = 0;

  setView(v) {
    this.view = v;

      exhaust: { exh: 1.0, rasp: 0.9, intake: 0.22, mech: 0.12, muffler: 1.0, cabin: 18000, room: 0.16, boost: 0.4 },
      bay: { exh: 0.5, rasp: 0.55, intake: 1.0, mech: 1.0, muffler: 0.3, cabin: 16000, room: 0.24, boost: 1.0 },
      cabin: { exh: 1.1, rasp: 0.15, intake: 0.45, mech: 0.3, muffler: 1.0, cabin: 650, room: 0.05, boost: 0.6 },

  configure(c) {

    this.cfg = c;
    const ev = [];
    for (let i = 0; i < c.n; i++) {
      const f = c.fire[i];
      ev.push({ a: mod720(f + c.evo), type: EV_EVO, cyl: i });
      ev.push({ a: mod720(f + c.ivo), type: EV_IVO, cyl: i });
      ev.push({ a: mod720(f + c.ivc), type: EV_IVC, cyl: i });
      ev.push({ a: mod720(f + c.evc), type: EV_EVC, cyl: i });

  /** A rough Gaussian (sum of three uniforms), mean 0 and spread about 1. */
  gauss() { return (this.rand() + this.rand() + this.rand()) * 0.577; }

  /** \`early\`: how far (in samples) the event's angle was passed before this sample. */
  trigger(e, early = 0) {

      // in the shape of the blowdown and in when it arrives (burn rate, and the crank speeding
      // up and slowing down between firings)
      const rough = (1 - this.thr) * clampN(1.5 - rpm / 3000, 0, 1);
      const spread = 0.05 + 0.1 * rough;

      let noiseA = Math.abs(A) * (0.5 + 0.9 * this.thr);

      this.valveRing.x += 0.007 * k;
      this.clickEnv += 0.018 * k;
    } else if (e.type === EV_TDC) {
      if (this.fired[i]) {
        const pk = this.peak[i] / 1e5;

        this.blockRing.x += 0.05 * k * (0.8 + 0.2 * this.rand());
        this.thudRing.x += 0.08 * k;

  }

  writePulse(wa, at, A, tau, noiseA) {
    const sr = this.sr;
    const inv = 1 / (tau * sr);

    const offset = Math.floor(at), fr = at - offset;
    const len = Math.min(Math.ceil(tau * 14 * sr) + 1, wa.mask - offset - 1);
    for (let k = 0; k < len; k++) {
      const x = (k - fr) * inv;
      if (x <= 0) continue;
      let v = x * Math.exp(1 - x);
      const y = (x - 1.6) / 2.2;
      if (y > 0) v -= 0.3 * y * Math.exp(1 - y);

        this.rasp.add(offset + k, noiseA * x * Math.exp(1 - x) * this.rand());
      }
    }
  }

  writeSoft(wa, offset, A, tau) {
    const sr = this.sr;
    const len = Math.min(Math.ceil(tau * 2 * sr), wa.mask - 1);
    for (let k = 0; k < len; k++) {
      const s = Math.sin((Math.PI * k) / len);
      wa.add(offset + k, A * s * s);
    }
  }

  process(L, R, N, now) {
    const sr = this.sr;
    if (!this.cfg) { L.fill(0); if (R !== L) R.fill(0); return; }
    const st = this.st;
    const stale = st.t > 0 ? now - st.t > 0.35 : true;
    const rpmTarget = stale ? 0 : st.rpm;

    if (this.msgPending) {
      this.msgPending = false;
      const pred = st.theta + 6 * st.rpm * clampN(now - st.t, 0, 0.2);
      const err = mod720(pred - this.theta + 360) - 360;
      if (this.rpm < 1 || Math.abs(err) > 200 || (st.rpm < 300 && Math.abs(err) > 45)) {
        this.theta = mod720(pred);
        this.rpm = st.rpm;

        this.resync();
      } else this.phaseErr = err;
    }

    // control-rate smoothing (per block)
    const blockT = N / sr;
    const kc = 1 - Math.exp(-blockT / 0.05);

    const flow = stale ? 0 : clampN(st.pMan / 1e5, 0, 1.2) * clampN(this.rpm / 6000, 0, 1.6);
    this.flowS += (flow - this.flowS) * kc;

    this.vacS += (vac - this.vacS) * kc;
    this.starterEnv += ((st.starter && !stale ? 1 : 0) - this.starterEnv) * (1 - Math.exp(-blockT / 0.03));
    if (st.dfco) this.dfcoT += blockT; else this.dfcoT = 0;
    const gs = this.gs, g = this.g;
    gs.exh += (g.exh - gs.exh) * kc; gs.rasp += (g.rasp - gs.rasp) * kc; gs.intake += (g.intake - gs.intake) * kc;
    gs.mech += (g.mech - gs.mech) * kc; gs.muffler += (g.muffler - gs.muffler) * kc; gs.cabin += (g.cabin - gs.cabin) * kc;
    gs.room += (g.room - gs.room) * kc; gs.boost += (g.boost - gs.boost) * kc;
    const ind = stale ? 0 : st.ind;
    this.nS += ((ind ? st.nC : 0) - this.nS) * (1 - Math.exp(-blockT / 0.04));
    this.flowCS += ((ind ? clampN(st.flowC, 0, 1.2) : 0) - this.flowCS) * kc;
    this.boostS += ((ind ? clampN((st.pB - 1.013e5) / 1e5, 0, 2.5) : 0) - this.boostS) * kc;
    this.surgeS += ((ind ? st.surge : 0) - this.surgeS) * (1 - Math.exp(-blockT / 0.02));
    if (this.bovPending > 0) { this.bovEnv = Math.max(this.bovEnv, clampN(0.45 + this.bovPending * 0.6, 0, 1.4)); this.bovAtk = 0; this.bovPending = 0; }
    // A turbine in the exhaust takes the energy out of each blowdown pulse: its scroll and wheel
    // smooth the pulses into a flow that carries little more than the firing frequency and its
    // first few harmonics, so a turbo engine sounds deep and muted rather than raspy. The housing
    // is always in the way; the faster the wheel turns, the more it takes.
    const turbine = ind === 1 ? clampN(0.75 + 0.2 * this.nS, 0, 0.95) : 0;
    if (turbine > 0) {
      const fireHz = (this.rpm / 120) * (this.cfg.n || 4);
      const fcT = clampN(1.9 * fireHz, 110, 750);
      for (const ch of this.banks) ch.turb.set(sr, fcT, 0.62);
    }
    gs.alive += ((stale ? 0 : 1) - gs.alive) * (1 - Math.exp(-blockT / 0.08));

    // the pipe resonance follows the gas temperature (speed of sound \u221D \u221AT); the tailpipe gas is
    // well below the port temperature
    this.egtS += ((stale ? 600 : clampN(st.egt, 300, 1400)) - this.egtS) * (1 - Math.exp(-blockT / 0.6));
    const cPipe = 20.05 * Math.sqrt(300 + 0.55 * (this.egtS - 300));
    for (const ch of this.banks) ch.pipe.Dt = clampN((ch.pipeL || 1.1) / cPipe * sr, 8, ch.pipe.size - 2);
    // filters that follow the operating point
    const fcMuffler = (260 + 1700 * this.thr + this.rpm * 0.12) * (1 - 0.5 * turbine);
    for (const ch of this.banks) { ch.lp.set(sr, fcMuffler, 0.75); ch.lp2.set(sr, fcMuffler * 2.2, 0.6); }
    this.roar.set(sr, 700 + this.rpm * 0.12, 0.9);
    this.cabinL.set(sr, gs.cabin, 0.8); this.cabinR.set(sr, gs.cabin, 0.8);
